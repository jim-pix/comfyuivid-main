<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wan 2.2 Video Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }

        select, input[type="text"], input[type="range"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-option {
            flex: 1;
            position: relative;
        }

        .radio-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .radio-option label {
            display: block;
            padding: 15px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-option input[type="radio"]:checked + label {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .file-upload {
            position: relative;
            overflow: hidden;
        }

        .file-upload input[type="file"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-label {
            display: block;
            padding: 20px;
            background: #f5f5f5;
            border: 2px dashed #667eea;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload-label:hover {
            background: #e8eaf6;
            border-color: #5568d3;
        }

        .file-upload-label.has-file {
            background: #e8f5e9;
            border-color: #4caf50;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }

        .slider-container {
            margin-top: 10px;
        }

        .slider-value {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            margin-left: 10px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
            background: #e0e0e0;
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #667eea;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .generate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .video-result {
            margin-top: 30px;
            text-align: center;
            display: none;
        }

        .video-result video {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .info-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .info-box p {
            color: #2e7d32;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 Wan 2.2 Generator</h1>
        <p class="subtitle">Créez des vidéos à partir de vos images</p>

        <div class="info-box">
            <p><strong>ℹ️ Information</strong></p>
            <p>Configuration RunPod requise : GPU avec 24GB+ VRAM (RTX 4090, A100)</p>
        </div>

        <form id="videoForm">
            <!-- Type de workflow -->
            <div class="form-group">
                <label for="workflowType">Type d'animation</label>
                <select id="workflowType" required>
                    <option value="1">Simple animation de l'image</option>
                    <option value="2">Animation + remplacement de fond</option>
                </select>
            </div>

            <!-- Upload image -->
            <div class="form-group">
                <label>Image de référence</label>
                <div class="file-upload">
                    <input type="file" id="imageInput" accept="image/*" required>
                    <label for="imageInput" class="file-upload-label" id="fileLabel">
                        📁 Cliquez pour sélectionner une image
                    </label>
                </div>
                <img id="imagePreview" alt="Preview">
            </div>

            <!-- Format vidéo -->
            <div class="form-group">
                <label>Format de la vidéo</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="format169" name="format" value="0" checked>
                        <label for="format169">16:9 (Horizontal)</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="format916" name="format" value="1">
                        <label for="format916">9:16 (Vertical)</label>
                    </div>
                </div>
            </div>

            <!-- Taille de sortie -->
            <div class="form-group">
                <label for="sizeScale">
                    Taille de la vidéo finale
                    <span class="slider-value" id="sizeValue">65%</span>
                </label>
                <div class="slider-container">
                    <input type="range" id="sizeScale" min="0.3" max="1.0" step="0.05" value="0.65">
                </div>
            </div>

            <!-- Longueur vidéo -->
            <div class="form-group">
                <label for="videoLength">
                    Longueur de la vidéo (frames)
                    <span class="slider-value" id="lengthValue">61</span>
                </label>
                <div class="slider-container">
                    <input type="range" id="videoLength" min="16" max="81" step="1" value="61">
                </div>
            </div>

            <!-- Prompt -->
            <div class="form-group">
                <label for="prompt">Prompt (description du mouvement)</label>
                <input type="text" id="prompt" placeholder="Ex: Une personne sourit et cligne des yeux" required>
            </div>

            <!-- Submit -->
            <button type="submit" class="generate-btn" id="generateBtn">
                🚀 Générer la vidéo
            </button>
        </form>

        <!-- Status -->
        <div class="status" id="status"></div>

        <!-- Video result -->
        <div class="video-result" id="videoResult">
            <h3>✅ Vidéo générée !</h3>
            <video controls id="videoPlayer"></video>
        </div>
    </div>

    <script>
        // Configuration
        const RUNPOD_ENDPOINT_ID = 'boftzxxbgyfd36'; // À remplacer
        const RUNPOD_API_KEY = 'rpa_AW2ZO432090DZPRQ4HHIVWEV5QV071CPER0SU9XY1tzek0';       // À remplacer

        // Elements
        const form = document.getElementById('videoForm');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const fileLabel = document.getElementById('fileLabel');
        const sizeScale = document.getElementById('sizeScale');
        const sizeValue = document.getElementById('sizeValue');
        const videoLength = document.getElementById('videoLength');
        const lengthValue = document.getElementById('lengthValue');
        const status = document.getElementById('status');
        const videoResult = document.getElementById('videoResult');
        const generateBtn = document.getElementById('generateBtn');

        // Preview image
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    fileLabel.textContent = `✅ ${file.name}`;
                    fileLabel.classList.add('has-file');
                };
                reader.readAsDataURL(file);
            }
        });

        // Update sliders
        sizeScale.addEventListener('input', function() {
            const percent = Math.round(this.value * 100);
            sizeValue.textContent = `${percent}%`;
        });

        videoLength.addEventListener('input', function() {
            lengthValue.textContent = this.value;
        });

        // Form submit
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Get form data
            const workflowType = parseInt(document.getElementById('workflowType').value);
            const format = parseInt(document.querySelector('input[name="format"]:checked').value);
            const scale = parseFloat(sizeScale.value);
            const length = parseInt(videoLength.value);
            const prompt = document.getElementById('prompt').value;

            // Get image as base64
            const file = imageInput.files[0];
            if (!file) {
                showStatus('error', 'Veuillez sélectionner une image');
                return;
            }

            const imageBase64 = await fileToBase64(file);

            // Show loading
            showStatus('loading', 'Envoi de la requête à RunPod...');
            generateBtn.disabled = true;
            videoResult.style.display = 'none';

            try {
                // Send to RunPod
                const response = await fetch(`https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/run`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${RUNPOD_API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        input: {
                            workflow_type: workflowType,
                            format: format,
                            size_scale: scale,
                            video_length: length,
                            user_prompt: prompt,
                            image_base64: imageBase64.split(',')[1], // Remove data:image/...;base64,
                            timeout: 900
                        }
                    })
                });

                const result = await response.json();

                if (result.error) {
                    showStatus('error', `Erreur: ${result.error}`);
                    return;
                }

                // Poll for result
                showStatus('loading', 'Génération en cours... Cela peut prendre plusieurs minutes.');
                const jobId = result.id;
                pollJobStatus(jobId);

            } catch (error) {
                showStatus('error', `Erreur: ${error.message}`);
                generateBtn.disabled = false;
            }
        });

        // Poll job status
        async function pollJobStatus(jobId) {
            const maxAttempts = 300; // 10 minutes max
            let attempts = 0;

            const interval = setInterval(async () => {
                attempts++;

                if (attempts > maxAttempts) {
                    clearInterval(interval);
                    showStatus('error', 'Timeout: la génération a pris trop de temps');
                    generateBtn.disabled = false;
                    return;
                }

                try {
                    const response = await fetch(`https://api.runpod.ai/v2/${RUNPOD_ENDPOINT_ID}/status/${jobId}`, {
                        headers: {
                            'Authorization': `Bearer ${RUNPOD_API_KEY}`
                        }
                    });

                    const result = await response.json();

                    if (result.status === 'COMPLETED') {
                        clearInterval(interval);
                        showStatus('success', '✅ Vidéo générée avec succès !');
                        
                        // Display video (you'll need to implement video retrieval from ComfyUI)
                        // For now, just show the result
                        console.log('Result:', result.output);
                        
                        generateBtn.disabled = false;
                    } else if (result.status === 'FAILED') {
                        clearInterval(interval);
                        showStatus('error', `Erreur: ${result.error || 'Unknown error'}`);
                        generateBtn.disabled = false;
                    } else {
                        // Still processing
                        const elapsed = Math.floor(attempts * 2);
                        showStatus('loading', `Génération en cours... (${elapsed}s)`);
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 2000); // Check every 2 seconds
        }

        // Utilities
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function showStatus(type, message) {
            status.className = `status ${type}`;
            status.textContent = message;
        }
    </script>
</body>
</html>
